# Render blueprint for the frontend only.
#
# Kept ready but not in use: the project runs locally. See "Deployment notes"
# in the README for why no free tier fits.
#
# The backend could never go here regardless — Render's free web service gives
# 512 MB of RAM and the model needs about 2 GB. The Dockerfile covers the API.
#
# VITE_API_URL is marked sync: false, so Render asks for the value instead of
# reading it from this file. It is baked into the bundle at build time, so the
# site must be rebuilt if the API URL ever changes.

services:
  - type: web
    name: fake-news-detection-ui
    runtime: static
    rootDir: ui
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      # Single-page app: unknown paths serve the app, not a 404.
      - type: rewrite
        source: /*
        destination: /index.html
